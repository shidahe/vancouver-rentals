name: Repair Arbutus price

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-arbutus-price.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair listing and history
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const listingsPath = 'data/listings.json';
          const historyPath = 'data/history.json';
          const payload = JSON.parse(fs.readFileSync(listingsPath, 'utf8'));
          const history = JSON.parse(fs.readFileSync(historyPath, 'utf8'));
          const id = 'arbutus-residences-315-2den-900';
          const listing = payload.listings.find(x => x.id === id);
          if (!listing) throw new Error('Arbutus Residences #315 not found');
          listing.rent = 4110;
          listing.status = 'unchanged';
          listing.priceDrop = false;
          listing.verificationMethod = 'Current tracked canonical Unit 315 rent restored to $4,110; automated price extraction from multi-unit building pages is disabled.';
          history[id] ||= [];
          history[id] = history[id].filter(h => !(h.rent !== 4110 && /AUTO price update/i.test(h.note || '')));
          if (!history[id].some(h => /AUTOMATION CORRECTION/.test(h.note || ''))) {
            history[id].push({date:'2026-08-19', rent:4110, note:'AUTOMATION CORRECTION: restored Unit 315 to $4,110 after the first crawler mixed in another floorplan price.'});
          }
          fs.writeFileSync(listingsPath, JSON.stringify(payload, null, 2) + '\n');
          fs.writeFileSync(historyPath, JSON.stringify(history, null, 2) + '\n');
          NODE
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json data/history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Arbutus Unit 315 rent after crawler test'
          git push
