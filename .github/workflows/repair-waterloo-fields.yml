name: Repair Waterloo fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-waterloo-fields.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact structured fields
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='data/listings.json';
          const data=JSON.parse(fs.readFileSync(p,'utf8'));
          const x=data.listings.find(v=>v.id==='waterloo-2477-zumper');
          if(!x) throw new Error('Waterloo listing not found');
          Object.assign(x,{lat:49.2645683,lng:-123.1800646,bedrooms:2,bathrooms:2.5,sqft:1100,ac:true,parking:true,petFriendly:true,orientation:'E',buildingYear:2010,balcony:true,largeWindows:true,modernInterior:true});
          x.dataNotes='Live automation confirmed $4,950. Static fields and exact coordinates are locked from Zumper JSON-LD/description.';
          fs.writeFileSync(p,JSON.stringify(data,null,2)+'\n');
          NODE
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use exact Waterloo structured listing fields'
          git push
