name: Site smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'image-cache.js'
      - 'style.css'
      - 'data/listings.json'
      - 'data/history.json'
      - 'data/images.json'
      - 'scripts/test-site.mjs'
      - '.github/workflows/site-smoke-test.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        id: smoke
        continue-on-error: true
        run: node scripts/test-site.mjs
      - name: Persist smoke report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site-test-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update site smoke test report'
            git pull --rebase origin main
            git push
          fi
      - name: Fail if smoke test failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
