name: Refresh rental inventory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push-triggered runs can sit in the shared concurrency queue while main
          # advances. Always start from the current main tip instead of the stale
          # event SHA so generated data is not rebased across another refresh.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live verifier, discovery, reconciliation, image cache, official freshness, data audit, and coverage audit
        run: npm run refresh
      - name: Browser smoke test against the freshly generated site
        id: smoke
        continue-on-error: true
        run: node scripts/test-site.mjs
      - name: Finalize decision readiness
        id: readiness
        continue-on-error: true
        run: node scripts/finalize-readiness.mjs
      # The runtime guard consumes the finalized report. Running it while the
      # audit is intentionally pending would correctly keep the site closed.
      - name: Runtime freshness fail-closed test
        id: freshness
        continue-on-error: true
        run: node scripts/test-freshness-guard.mjs
      - name: Block publication when the fresh site is not decision-ready
        if: steps.smoke.outcome != 'success' || steps.freshness.outcome != 'success' || steps.readiness.outcome != 'success'
        run: |
          echo 'Fresh rental data did not pass every publication gate; leaving main unchanged.' >&2
          exit 1
      - name: Commit refreshed rental data, cached images, and validation reports
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json data/history.json data/candidates.json data/rentalsca-candidates.json data/livrent-candidates.json data/craigslist-candidates.json data/realtylink-candidates.json data/reconciliation-state.json data/refresh-state.json data/image-sources.json data/images.json data/image-cache-report.json data/zumper-ambiguity-report.json data/purpose-built-status.json data/official-status.json data/official-status-actions.json data/quality-report.json data/coverage-report.json data/scope-filter-report.json data/site-test-report.json data/evidence assets/listings
          if git diff --cached --quiet; then
            echo 'No rental data, image cache, or validation changes.'
            exit 0
          fi
          git commit -m 'Automated live rental refresh'
          # Generated inventory takes several minutes to verify. Do not discard
          # a fully validated refresh because GitHub returns a transient 5xx or
          # main advances while the job is running.
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo 'Unable to publish validated rental data after four attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
