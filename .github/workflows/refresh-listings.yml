name: Refresh rental inventory

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-listings.mjs'
      - 'scripts/refresh-safe.mjs'
      - 'scripts/refresh-zumper-units-v2.mjs'
      - 'scripts/refresh-rentalsca.mjs'
      - 'scripts/refresh-livrent.mjs'
      - 'scripts/refresh-craigslist.mjs'
      - 'scripts/refresh-realtylink.mjs'
      - 'scripts/reconcile-candidates.mjs'
      - 'scripts/refresh-purposebuilt.mjs'
      - 'scripts/refresh-official-status.mjs'
      - 'scripts/apply-official-status.mjs'
      - 'scripts/cache-listing-images.mjs'
      - 'scripts/audit-data-quality.mjs'
      - 'scripts/audit-coverage.mjs'
      - 'scripts/test-site.mjs'
      - 'scripts/finalize-readiness.mjs'
      - 'data/live-sources.json'
      - 'data/purpose-built-watch.json'
      - 'data/automation-policy.json'
      - 'data/manual-overrides.json'
      - 'data/official-watch.json'
      - 'package.json'
      - '.github/workflows/refresh-listings.yml'

permissions:
  contents: write

concurrency:
  group: rental-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live verifier, discovery, reconciliation, image cache, official freshness, data audit, and coverage audit
        run: npm run refresh
      - name: Browser smoke test against the freshly generated site
        id: smoke
        continue-on-error: true
        run: node scripts/test-site.mjs
      - name: Finalize decision readiness
        id: readiness
        continue-on-error: true
        run: node scripts/finalize-readiness.mjs
      - name: Commit refreshed rental data, cached images, and validation reports
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json data/history.json data/candidates.json data/rentalsca-candidates.json data/livrent-candidates.json data/craigslist-candidates.json data/realtylink-candidates.json data/reconciliation-state.json data/refresh-state.json data/image-sources.json data/images.json data/image-cache-report.json data/purpose-built-status.json data/official-status.json data/official-status-actions.json data/quality-report.json data/coverage-report.json data/site-test-report.json data/evidence assets/listings
          if git diff --cached --quiet; then
            echo 'No rental data, image cache, or validation changes.'
            exit 0
          fi
          git commit -m 'Automated live rental refresh'
          git pull --rebase origin main
          git push
      - name: Fail when the fresh site is not decision-ready
        if: steps.smoke.outcome != 'success' || steps.readiness.outcome != 'success'
        run: exit 1
