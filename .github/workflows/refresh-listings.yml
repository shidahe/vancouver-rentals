name: Refresh rental inventory

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-listings.mjs'
      - 'scripts/refresh-safe.mjs'
      - 'scripts/refresh-zumper-units-v2.mjs'
      - 'scripts/refresh-rentalsca.mjs'
      - 'scripts/refresh-livrent.mjs'
      - 'scripts/refresh-craigslist.mjs'
      - 'scripts/reconcile-candidates.mjs'
      - 'data/live-sources.json'
      - 'data/automation-policy.json'
      - 'data/manual-overrides.json'
      - 'package.json'
      - '.github/workflows/refresh-listings.yml'

permissions:
  contents: write

concurrency:
  group: rental-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live verifier, per-unit discovery, candidate adapters, and reconciliation
        run: npm run refresh

      - name: Commit refreshed rental data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json data/history.json data/candidates.json data/rentalsca-candidates.json data/livrent-candidates.json data/craigslist-candidates.json data/reconciliation-state.json data/refresh-state.json data/image-sources.json data/evidence
          if git diff --cached --quiet; then
            echo 'No rental data changes.'
            exit 0
          fi
          git commit -m 'Automated live rental refresh'
          git pull --rebase origin main
          git push
